<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Sign in</title>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial; max-width:720px; margin:40px auto; padding:0 16px; color:#111; }
  form { display:flex; flex-direction:column; gap:8px; }
  input[type="password"] { padding:8px; font-size:1rem; width:100%; box-sizing:border-box; }
  button { padding:8px 12px; font-size:1rem; }
  #msg { margin-top:10px; color:#b00; }
</style>
</head>
<body>
  <h1>Sign in</h1>

  <form id="loginForm" autocomplete="off">
    <input id="pw" type="password" name="password" autocomplete="current-password" placeholder="Password" required />
    <label><input id="remember" type="checkbox" /> Remember this WAN IP on the server</label>
    <div>
      <button type="submit">Sign in</button>
    </div>
  </form>

  <div id="msg" aria-live="polite"></div>

<script>
/* Client posts password to server for verification.
   Server will save the request IP to allowed_ips.json when remember is true.
   This avoids storing secrets in HTML and keeps the authoritative check server-side. */

async function postJSON(url, data) {
  const resp = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
    body: JSON.stringify(data)
  });
  const j = await resp.json().catch(()=>({}));
  return { ok: resp.ok, status: resp.status, json: j };
}

document.getElementById('loginForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const msg = document.getElementById('msg');
  msg.textContent = 'Checking...';
  const pw = document.getElementById('pw').value;
  const remember = document.getElementById('remember').checked;

  try {
    const r = await postJSON('/login', { password: pw, remember: remember });
    if (!r.ok) {
      msg.textContent = r.json && r.json.error ? 'Invalid password' : 'Login failed';
      return;
    }
    // success: server set session cookie and optionally saved IP
    document.getElementById('pw').value = '';
    location.href = 's1rfxuj9yk.html';
  } catch (err) {
    msg.textContent = 'Error: ' + String(err);
  }
});
</script>
</body>
</html>
